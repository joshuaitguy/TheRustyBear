# https://aka.ms/yaml


pool:
  name: 'PHX-Games'

steps:
- powershell: |
   $ServerServiceNames = @("RustUMod")
   
   $ServerServiceNames | %{ Stop-Service -Name $_}
   
   Write-Host "##vso[task.setvariable variable=ServicesStopped;isOutput=true]Yes"
  displayName: 'Stop Rust Server'

- task: PowerShell@2
  displayName: 'Install / Update Rust Server'
  inputs:
    targetType: filePath
    filePath: './$(System.DefaultWorkingDirectory)/release/.scripts/Update-BaseRustServer.ps1'
  condition: eq(variables['InstallRust'], 'true')

- task: PowerShell@2
  displayName: 'Install UMod'
  inputs:
    targetType: filePath
    filePath: './$(System.DefaultWorkingDirectory)/release/.scripts/Install-RustOxide.ps1'
  condition: eq(variables['InstallUMod'],'true')
