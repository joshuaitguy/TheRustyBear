parameters:
  - name: DownloadArtifacts
    type: boolean
    default: false
  - name: StopServer
    type: boolean
    default: true

steps:
- task: PowerShell@2
  displayName: 'Stop Rust Server'
  condition: and(Succeeded(), eq(parameters['StopServer'], true))
  inputs:
    targetType: inline
    script: |
      $ServerServiceNames = @("RustUMod")
      $serviceRunning = Get-Service -name "RustUMod"
      if($serviceRunning.Status -eq 'Running')
      {
        $ServerServiceNames | %{ Stop-Service -Name $_}
      }
      else
      {
        "Service already stopped"
      }
- ${{ if eq(parameters.DownloadArtifacts, true) }}:
  - task: DownloadBuildArtifacts@1
    inputs:
      buildType: specific
      project: Game Server Hosting
      pipeline: TheRustyBear
      buildVersionToDownload: latestFromBranch
      branchName: main
      downloadType: specific
      downloadPath: ${{ variables.DeployRoot }}
