parameters:
  - name: DownloadArtifacts
    type: boolean
    default: false

steps:
- task: PowerShell@2
  displayName: 'Stop Rust Server'
  inputs:
    targetType: inline
    script: |
      $ServerServiceNames = @("RustUMod")
      $serviceRunning = Get-Service -name "RustUMod"
      if($serviceRunning.Status -eq 'Running')
      {
        $ServerServiceNames | %{ Stop-Service -Name $_}
      }
      else
      {
        "Service already stopped"
      }
- ${{ if eq(parameters.DownloadArtifacts, true) }}:
  - task: DownloadBuildArtifacts@1
    inputs:
      artifactName: ConfigSnapShot
      buildType: current
      downloadType: single
      downloadPath: ${{ variables.DeployRoot }}/ConfigSnapShot
  - task: DownloadBuildArtifacts@1
    inputs:
      artifactName: Scripts
      buildType: current
      downloadType: single
      downloadPath: ${{ variables.DeployRoot }}/Scripts